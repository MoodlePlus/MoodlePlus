<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Moodle+</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      The on-page overlay builds this same structure inside its shadow root
      (PANEL_MARKUP in src/content-scripts/overlay.js) - keep the two in sync.
    -->
    <div id="app">
      <!-- Header: title and the dark mode switch. -->
      <div id="topbar">
        <div>
          <h1>Moodle+</h1>
        </div>
        <div class="toggle-group">
          <label for="dark-mode-toggle" class="toggle-label">Dark mode</label>
          <label class="switch">
            <input type="checkbox" id="dark-mode-toggle" role="switch">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <!-- Tabs; src/ui/tabs.js shows the panel each tab's aria-controls points to. -->
      <nav id="tabs" role="tablist" aria-label="Moodle+ views">
        <button type="button" class="tab" id="tab-calendar" role="tab"
                aria-selected="true" aria-controls="view-calendar">Calendar</button>
        <button type="button" class="tab" id="tab-calculator" role="tab"
                aria-selected="false" aria-controls="view-calculator" tabindex="-1">Grade Calculator</button>
      </nav>

      <!-- Filled in by src/popup/views/calendarView.js and calculatorView.js. -->
      <main id="views">
        <section id="view-calendar" class="view" role="tabpanel" aria-labelledby="tab-calendar"></section>
        <section id="view-calculator" class="view" role="tabpanel" aria-labelledby="tab-calculator" hidden></section>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
